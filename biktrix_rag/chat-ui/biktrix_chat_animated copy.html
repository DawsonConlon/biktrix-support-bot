<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biktrix Support Tool — Animated</title>
<style>
  :root {
    --orange: #ff5a1f;
    --bg: #0f1115;
    --panel: #1a1d23;
    --bot: #23272f;
    --txt: #f2f3f5;
    --px: 3px; /* pixel size */
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--txt);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- Header / animation stage ---- */
  header {
    position: relative;
    overflow: hidden;
    background: var(--panel);
    height: 70px;
    border-bottom: 1px solid #2a2e36;
  }

  header .title {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    font-size: 18px;
    font-weight: 600;
    pointer-events: none;
  }

  header .title span {
    color: var(--orange);
  }

  header .ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 10px;
    height: 2px;
    background: #2a2e36;
    z-index: 1;
  }

  /* The pixel sprite: a grid of tiny blocks, rebuilt by JS each frame */
  .sprite {
    position: absolute;
    bottom: 8px;
    z-index: 2;
    display: grid;
    grid-auto-rows: var(--px);
    image-rendering: pixelated;
    will-change: left, transform;
  }

  .sprite i {
    width: var(--px);
    height: var(--px);
    display: block;
  }

  /* ---- Chat (identical behaviour to the original) ---- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .user {
    align-self: flex-end;
    background: var(--orange);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bot {
    align-self: flex-start;
    background: var(--bot);
    border-bottom-left-radius: 4px;
  }

  .bot a {
    color: #6db3ff;
  }

  .typing {
    opacity: .6;
    font-style: italic;
  }

  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: var(--panel);
    border-top: 1px solid #2a2e36;
  }

  input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #10131a;
    color: var(--txt);
    font-size: 15px;
    outline: none;
  }

  input:focus {
    border-color: var(--orange);
  }

  button {
    padding: 0 22px;
    border: 0;
    border-radius: 10px;
    background: var(--orange);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }

  button:disabled {
    opacity: .5;
    cursor: default;
  }
</style>
</head>
<body>
  <header>
    <div class="title"> Biktrix Support <span>Tool</span></div>
    <div class="ground"></div>
    <div class="sprite" id="sprite"></div>
  </header>
  <p style="padding: 12px 20px; background: #ff5a1f; color: #fbfbfb; margin: 0; font-size: 14px;">
    <strong>⚠ Disclaimer:</strong> All suggestions must be used at your own risk. If unsure, contact our support team <a href="https://www.biktrix.ca/pages/contact-us" target="_blank" style="color:#fff; font-weight:bold; text-decoration:underline;">here</a>.
  </p>

  <div id="chat">
    <div class="msg bot">Hi! Ask me anything about your Biktrix eBike — batteries, motors, display, troubleshooting, and more.</div>
  </div>
  <form id="form">
    <input id="q" placeholder="Type your question…" autocomplete="off" autofocus />
    <button id="send" type="submit">Send</button>
  </form>

<script>
/* ================= CHAT (unchanged from original) ================= */
const WEBHOOK = "https://n8n.biktrix.com/webhook/biktrix-support";
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");

function add(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "bot") {
    div.innerHTML = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  add(question, "user");
  input.value = "";
  sendBtn.disabled = true;
  const typing = add("…thinking…", "bot");
  typing.classList.add("typing");
  try {
    const res = await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    typing.remove();
    add(data.answer || "Sorry, something went wrong.", "bot");
  } catch (err) {
    typing.remove();
    add("Couldn't reach the bot. Check your internet connection and try again.", "bot");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

/* ================= PIXEL SPRITE ANIMATION ================= */
// Colour legend for the pixel maps
const COLORS = {
  '.': null,            // transparent
  'H': '#16181d',       // helmet
  'F': '#f1c27d',       // face / skin
  'A': '#f1c27d',       // arm (skin)
  'T': '#2d7dd2',       // torso (blue)
  'L': '#3a3a3a',       // leg
  'B': '#ff5a1f',       // bike frame (Biktrix orange)
  'O': '#444',          // wheel
  'o': '#444',          // detached wheel pieces
  'P': '#9be7ff',       // phone screen
  'x': '#ffd23f'        // spark / trouble
};

// Each frame is an array of equal-ish rows; we pad them to a common width.
const RAW = {
  ride1: [
    "......HH........",
    ".....HFFH.......",
    ".....HFFH.......",
    "......TT........",
    ".....TTTT.......",
    "....TTTTTA......",
    "...TT..T..A.....",
    "..B..BBB...B....",
    ".B.B...B..B.B...",
    ".OOO.....OOO....",
    "O...O...O...O...",
    "O...O...O...O...",
    ".OOO.....OOO...."
  ],
  ride2: [
    "......HH........",
    ".....HFFH.......",
    ".....HFFH.......",
    "......TT........",
    ".....TTTT.......",
    "....TTTTTA......",
    "...TT.T...A.....",
    "..B.BBB....B....",
    ".B.B..B...B.B...",
    ".OOO.....OOO....",
    "O...O...O...O...",
    "O...O...O...O...",
    ".OOO.....OOO...."
  ],
  broken: [
    "......HH....x...",
    ".....HFFH..x....",
    ".....HFFH.......",
    "......TT........",
    ".....TTTT.......",
    "....TTTTT.......",
    "...TT..TT.......",
    "..B..BBB........",
    ".B.B...B...o.o..",
    ".OOO......o...o.",
    "O...O.....o...o.",
    "O...O......o.o..",
    ".OOO............"
  ],
  phone: [
    "......HH........",
    ".....HFFH.......",
    ".....HFFHPP.....",
    "......TTAPP.....",
    ".....TTTTA......",
    "....TTTTT.......",
    "...TT..TT.......",
    "...L....L.......",
    "...L....L.......",
    "...L....L.......",
    "..LL....LL......",
    "................",
    "................"
  ]
};

// Normalise: pad every row to the widest row so the grid is rectangular.
function normalise(rows) {
  const w = Math.max(...rows.map(r => r.length));
  return rows.map(r => r.padEnd(w, '.'));
}
const FRAMES = {};
let COLS = 0;
for (const k in RAW) {
  FRAMES[k] = normalise(RAW[k]);
  COLS = Math.max(COLS, FRAMES[k][0].length);
}

const spriteEl = document.getElementById("sprite");
spriteEl.style.gridTemplateColumns = `repeat(${COLS}, var(--px))`;

function render(frameKey, flip) {
  const rows = FRAMES[frameKey];
  let html = "";
  for (const row of rows) {
    for (const ch of row) {
      const c = COLORS[ch];
      html += c ? `<i style="background:${c}"></i>` : `<i></i>`;
    }
  }
  spriteEl.innerHTML = html;
  spriteEl.style.transform = flip ? "scaleX(-1)" : "scaleX(1)";
}

// Timeline: ride in → break down → look at phone → fixed → ride off (then loop)
const PX = 3; // must match --px in CSS
const SPRITE_W = COLS * PX;
const T = { rideIn: 4200, broken: 1600, phone: 2600, fixed: 500, rideOut: 2600 };
const TOTAL = T.rideIn + T.broken + T.phone + T.fixed + T.rideOut;
let start = performance.now();

function tick(now) { 
  const stage = document.querySelector("header").clientWidth;
  const centerX = stage / 2 - SPRITE_W / 2;
  let t = (now - start) % TOTAL;
  let x, frame, flip = false, shake = 0;

  if (t < T.rideIn) {
    const p = t / T.rideIn;                       // 0..1
    x = -SPRITE_W + p * (centerX + SPRITE_W);
    frame = (Math.floor(now / 160) % 2) ? "ride1" : "ride2";
  } else if (t < T.rideIn + T.broken) {
    x = centerX;
    frame = "broken";
    shake = Math.sin(now / 60) * 1.5;             // little wobble
  } else if (t < T.rideIn + T.broken + T.phone) {
    x = centerX;
    frame = "phone";
  } else if (t < T.rideIn + T.broken + T.phone + T.fixed) {
    x = centerX;
    frame = "ride1";                              // ta-da, fixed!
  } else {
    const p = (t - (T.rideIn + T.broken + T.phone + T.fixed)) / T.rideOut;
    x = centerX + p * (stage - centerX + SPRITE_W);
    frame = (Math.floor(now / 160) % 2) ? "ride1" : "ride2";
  }

  render(frame, flip);
  spriteEl.style.left = x + "px";
  spriteEl.style.marginBottom = shake + "px";
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
