<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biktrix Support Bot</title>
<style>
  :root { --orange:#ff5a1f; --bg:#0f1115; --panel:#1a1d23; --bot:#23272f; --txt:#f2f3f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--panel); padding:16px 20px; font-size:18px; font-weight:600; border-bottom:1px solid #2a2e36; }
  header span { color:var(--orange); }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:80%; padding:12px 16px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--orange); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .bot a { color:#6db3ff; }
  .typing { opacity:.6; font-style:italic; }
  form { display:flex; gap:10px; padding:16px 20px; background:var(--panel); border-top:1px solid #2a2e36; }
  input { flex:1; padding:13px 16px; border-radius:10px; border:1px solid #333; background:#10131a; color:var(--txt); font-size:15px; outline:none; }
  input:focus { border-color:var(--orange); }
  button { padding:0 22px; border:0; border-radius:10px; background:var(--orange); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <header>🚲 Biktrix Support <span>Bot</span></header>
  <div id="chat">
    <div class="msg bot">Hi! Ask me anything about your Biktrix eBike — batteries, motors, display, troubleshooting, and more.</div>
  </div>
  <form id="form">
    <input id="q" placeholder="Type your question…" autocomplete="off" autofocus />
    <button id="send" type="submit">Send</button>
  </form>

<script>
const WEBHOOK = "https://n8n.biktrix.com/webhook/biktrix-support";
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");

function add(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  // linkify URLs in bot replies
  if (who === "bot") {
    div.innerHTML = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  add(question, "user");
  input.value = "";
  sendBtn.disabled = true;
  const typing = add("…thinking…", "bot");
  typing.classList.add("typing");
  try {
    const res = await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    typing.remove();
    add(data.answer || "Sorry, something went wrong.", "bot");
  } catch (err) {
    typing.remove();
    add("Couldn't reach the bot. Check your internet connection and try again.", "bot");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
